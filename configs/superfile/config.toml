# Use EDITOR, which defaults to Micro in the shared shell environment.
editor = ""
dir_editor = ""
auto_check_update = false
cd_on_quit = true # Used by the shell's n() directory-jump helper.
default_open_file_preview = true
show_image_preview = true
show_panel_footer_info = true
default_directory = "."
file_size_use_si = false
default_sort_type = 4 # Natural ordering: file2 before file10.
sort_order_reversed = false
case_sensitive_sort = false
shell_close_on_success = false
page_scroll_size = 0
debug = false
ignore_missing_fields = false
file_panel_extra_columns = 0
file_panel_name_percent = 50

theme = "TruDE"
code_previewer = ""
nerdfont = true
show_select_icons = true
transparent_background = false
file_preview_width = 0
enable_file_preview_border = true
sidebar_width = 20
sidebar_sections = ["home", "pinned", "disks"]
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'

# Leave optional integrations off unless their dependencies are installed.
metadata = false
enable_md5_checksum = false
zoxide_support = false

# Other files retain Superfile's xdg-open default. Keep this table last.
[open_with]
jpg = "TruDE-superfile-open"
jpeg = "TruDE-superfile-open"
png = "TruDE-superfile-open"
gif = "TruDE-superfile-open"
webp = "TruDE-superfile-open"
bmp = "TruDE-superfile-open"
tif = "TruDE-superfile-open"
tiff = "TruDE-superfile-open"
svg = "TruDE-superfile-open"
heic = "TruDE-superfile-open"
avif = "TruDE-superfile-open"
mp3 = "TruDE-superfile-open"
flac = "TruDE-superfile-open"
ogg = "TruDE-superfile-open"
oga = "TruDE-superfile-open"
opus = "TruDE-superfile-open"
wav = "TruDE-superfile-open"
m4a = "TruDE-superfile-open"
aac = "TruDE-superfile-open"
wma = "TruDE-superfile-open"
aiff = "TruDE-superfile-open"
ape = "TruDE-superfile-open"
