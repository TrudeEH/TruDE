# Sizes are MiB, calculated from MemTotal on every boot, not install-time RAM.
# 1:1 through 4 GiB, then 1:2 for additional RAM, capped at 32 GiB.
# Examples: 512 MiB -> 512 MiB; 8 GiB -> 6 GiB; 64+ GiB -> 32 GiB.
# This is logical swap capacity, not preallocated physical RAM. Incompressible
# pages and metadata still consume RAM; zRAM cannot guarantee extra capacity.
[zram0]
host-memory-limit = none
zram-size = min(min(ram, 4096) + max(ram - 4096, 0) / 2, 32768)
compression-algorithm = zstd
swap-priority = 100
